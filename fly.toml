app = "learn-albert"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  # The in-memory store seeds the demo course and worksheet on start (src/instrumentation.ts).
  STORE = "memory"
  LLM_PROVIDER = "bedrock"

[http_service]
  internal_port = 3000
  force_https = true
  # One machine that stays up: the in-memory store keeps students' work for the whole judging window.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

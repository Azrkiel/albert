<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Albert — pose transition</title><style>body{background:#FAF7F0;color:#182B49;font:16px/1.5 system-ui;margin:32px}img{display:block;width:256px;height:256px}button{padding:12px 20px;border-radius:999px;border:0;background:#182B49;color:#FAF7F0;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #182B49;outline-offset:3px}</style></head><body><h1>Guiding → waiting</h1><p>A single 180 ms crossfade between aligned static poses.</p><img id="pose" src="../normalized/256/albert-guiding.png" alt="Albert guiding"><button id="play" type="button">Preview transition</button><p id="status" role="status"></p><script>document.getElementById('play').addEventListener('click',()=>{const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;document.getElementById('pose').src=reduced?'../normalized/256/albert-waiting.png':'guiding-to-waiting.webp?'+Date.now();document.getElementById('pose').alt='Albert waiting';document.getElementById('status').textContent=reduced?'Static waiting pose shown for reduced motion.':'One transition, ending with the waiting pose.'})</script></body></html>
